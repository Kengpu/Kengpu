name: Generate GitHub Profile Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:

# 1️⃣ GitHub Stats Images
  stats_images:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"
          cache: "pip"

      - name: Install requirements
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate stats images
        run: |
          echo "Waiting for GitHub API cooldown..."
          sleep 20
          python3 generate_images.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDE_FORKED_REPOS: true

      - name: Commit generated images
        run: |
          git config --global user.name "github-stats[bot]"
          git config --global user.email "github-stats[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update generated profile assets" || echo "No changes to commit"
          git push

# 2️⃣ GitHub Metrics
  metrics:
    runs-on: ubuntu-latest
    needs: stats_images
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

# 3️⃣ Snake Animation
  snake_animation:
    runs-on: ubuntu-latest
    needs: metrics
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
